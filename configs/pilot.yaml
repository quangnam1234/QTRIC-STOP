seed: 20260731

dataset:
  path: "../Polliradar dataset.zip"
  strict_inventory: true
  max_subjects_per_species: null
  max_recordings_per_subject: 2

gates:
  min_subjects_total: 25
  min_species: 5
  fallback_event_fraction_max: 0.05

events:
  max_events_per_recording: 6
  fallback_top_k: 0

model:
  backend: "paper_hybrid"
  catboost_iterations: 120
  catboost_depth: 6
  catboost_learning_rate: 0.05
  extra_trees_estimators: 200
  min_samples_leaf: 2
  n_jobs: -1

cv:
  outer_protocol: "stratified_group_kfold"
  outer_splits: 4
  inner_splits: 3
  max_outer_folds: null

policy:
  epsilons: [0.05, 0.10, 0.15]
  delta: 0.10
  bound_method: "bootstrap_subject"
  bootstrap_repeats: 1000
  confidence_grid: [0.60, 0.70, 0.80, 0.85, 0.90, 0.95]
  js_grid: [0.05, 0.10, 0.20, 1.0]
  harmonic_ratio_grid: [0.0, 0.25, 0.40]
  harmonic_energy_grid: [0.0, 0.10, 0.20]
  f0_delta_grid_hz: [50.0, 100.0, 1000000.0]
  persistence_grid: [1, 2]
